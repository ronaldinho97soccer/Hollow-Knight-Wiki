    function mostrarCriaturas(filtro = "") {
      const termo = filtro.trim().toLowerCase();

      const resultados = criaturas.filter(criatura =>
        criatura.nome.toLowerCase().includes(termo)
      );

      lista.innerHTML = resultados.map(criatura => `
        <div class="cartao">
          <h2>${criatura.nome}</h2>
          <p>Derrotas: ${criatura.derrotas}</p>
        </div>
      `).join("");

      if (resultados.length === 0) {
        lista.innerHTML = "<p>Nenhuma criatura encontrada.</p>";
      }
    }

    busca.addEventListener("input", () => mostrarCriaturas(busca.value));
